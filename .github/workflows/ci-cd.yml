name: UniBus CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  AWS_ACCOUNT_ID: "432439355654"
  AWS_ROLE_ARN: arn:aws:iam::432439355654:role/unibus-github-actions-deploy-role
  BACKEND_ECR_REPOSITORY: unibus-backend
  FRONTEND_ECR_REPOSITORY: unibus-frontend
  ECS_CLUSTER: unibus-dev-cluster
  ECS_SERVICE: unibus-dev-service
  ECS_TASK_DEFINITION: unibus-dev
  BACKEND_CONTAINER: backend
  FRONTEND_CONTAINER: frontend
  ECS_HEALTH_CHECK_GRACE_PERIOD_SECONDS: "180"
  CLOUDFRONT_DISTRIBUTION_ID: E3UXOP9YII5ML8
  CLOUDFRONT_DOMAIN: d8xawk4fn4vfd.cloudfront.net
  NEXT_PUBLIC_GOOGLE_CLIENT_ID: 514047178254-t3vq0t83ad6vph9df3260bd3t0ll7ld6.apps.googleusercontent.com
  NEXT_PUBLIC_API_BASE_URL: /api/v1

jobs:
  validate:
    name: Validate backend and frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test backend
        working-directory: backend
        shell: bash
        run: |
          set +e
          mvn -B -ntp clean test
          status="$?"
          if [ "$status" -ne 0 ]; then
            echo "Backend tests failed. Surefire report excerpts:"
            find target/surefire-reports -type f -name "*.txt" -print -exec sed -n '1,220p' {} \; || true
            while IFS= read -r report; do
              message="$(tr '\n' ' ' < "$report" | cut -c1-900)"
              echo "::error file=backend/${report},line=1::${message}"
            done < <(find target/surefire-reports -type f -name "*.txt" 2>/dev/null)
            exit "$status"
          fi

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare image tags
        id: images
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "backend=${registry}/${BACKEND_ECR_REPOSITORY}:main-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "frontend=${registry}/${FRONTEND_ECR_REPOSITORY}:main-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.backend }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.frontend }}
          build-args: |
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ env.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}

      - name: Download current ECS task definition
        shell: bash
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition > task-definition.json
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )
          | .containerDefinitions |= map(
              .environment = ((.environment // []) | map(select(.name != "NEXT_PUBLIC_USE_MOCK")))
            )' task-definition.json > task-definition-clean.json

      - name: Render backend image
        id: render-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-clean.json
          container-name: ${{ env.BACKEND_CONTAINER }}
          image: ${{ steps.images.outputs.backend }}

      - name: Render frontend image
        id: render-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-backend.outputs.task-definition }}
          container-name: ${{ env.FRONTEND_CONTAINER }}
          image: ${{ steps.images.outputs.frontend }}

      - name: Ensure ECS health check grace period
        shell: bash
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --health-check-grace-period-seconds "$ECS_HEALTH_CHECK_GRACE_PERIOD_SECONDS" \
            >/dev/null

      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-frontend.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 25

      - name: Diagnose ECS deployment failure
        if: failure()
        shell: bash
        run: |
          echo "Recent ECS service events:"
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].events[0:10].[createdAt,message]' \
            --output table || true

          echo "Recent stopped tasks:"
          stopped_tasks="$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$ECS_SERVICE" \
            --desired-status STOPPED \
            --max-results 5 \
            --query 'taskArns' \
            --output text || true)"

          if [ -n "$stopped_tasks" ] && [ "$stopped_tasks" != "None" ]; then
            aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks $stopped_tasks \
              --query 'tasks[].{task:taskArn,stoppedReason:stoppedReason,containers:containers[].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason}}' \
              --output json || true
          else
            echo "No stopped tasks found for service $ECS_SERVICE."
          fi

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      - name: Smoke test CloudFront
        shell: bash
        run: |
          curl --fail --location --head "https://${CLOUDFRONT_DOMAIN}/"
          status="$(curl -s -o /tmp/unibus-login.json -w '%{http_code}' \
            -X POST "https://${CLOUDFRONT_DOMAIN}/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            --data '{"email":"driver.iter1@unibus.local","password":"wrong","device":"github-actions"}')"
          test "$status" = "401"
