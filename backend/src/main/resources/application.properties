spring.application.name=unibus-api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_TLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:10000}

# V1 represents the existing shared schema; new environments must provision it before starting the API.
spring.flyway.baseline-on-migrate=${DB_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:15}
app.jwt.refresh-token-days=${JWT_REFRESH_DAYS:14}
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}
app.otp.log-code=${OTP_LOG_CODE:true}
app.mail.enabled=${SMTP_ENABLED:false}
app.mail.from=${SMTP_FROM:${SMTP_USERNAME:}}
app.mail.from-name=${SMTP_FROM_NAME:UniBus}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.vision.credentials-path=${GOOGLE_APPLICATION_CREDENTIALS:}
app.ocr.enabled=${OCR_ENABLED:false}
app.ocr.provider=${OCR_PROVIDER:google}
app.aws.region=${AWS_REGION:ap-southeast-1}
app.upload.student-verification-dir=${STUDENT_VERIFICATION_UPLOAD_DIR:uploads/student-verifications}
app.upload.profile-avatar-dir=${PROFILE_AVATAR_UPLOAD_DIR:uploads/profile-avatars}
