spring.application.name=unibus-api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.mail.host=${SMTP_HOST:${MAIL_SMTP_HOST:}}
spring.mail.port=${SMTP_PORT:${MAIL_SMTP_PORT:587}}
spring.mail.username=${SMTP_USERNAME:${MAIL_SMTP_USERNAME:}}
spring.mail.password=${SMTP_PASSWORD:${MAIL_SMTP_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_TLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:10000}

# File upload limits (student card images can be 5-10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# V1 represents the existing shared schema; new environments must provision it before starting the API.
spring.flyway.baseline-on-migrate=${DB_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=false

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:15}
app.jwt.refresh-token-days=${JWT_REFRESH_DAYS:14}
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}
app.otp.log-code=${OTP_LOG_CODE:true}
app.mail.enabled=${SMTP_ENABLED:${MAIL_ENABLED:false}}
app.mail.from=${SMTP_FROM:${MAIL_FROM:${SMTP_USERNAME:${MAIL_SMTP_USERNAME:}}}}
app.mail.from-name=${SMTP_FROM_NAME:${MAIL_FROM_NAME:UniBus}}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.vision.credentials-path=${GOOGLE_APPLICATION_CREDENTIALS:}
app.ocr.enabled=${OCR_ENABLED:false}
app.ocr.provider=${OCR_PROVIDER:google}
app.aws.region=${AWS_REGION:ap-southeast-1}
app.ai.enabled=${AI_ENABLED:true}
app.ai.provider=${AI_PROVIDER:zai}
app.ai.bedrock.model-id=${AI_BEDROCK_MODEL_ID:amazon.nova-lite-v1:0}
app.ai.zai.api-key=${ZAI_API_KEY:}
app.ai.zai.base-url=${ZAI_BASE_URL:https://api.z.ai/api/paas/v4/}
app.ai.zai.model-id=${ZAI_MODEL_ID:glm-4.5-flash}
app.ai.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:1200}
app.ai.temperature=${AI_TEMPERATURE:0.2}
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.local-base-dir=${UPLOAD_BASE_DIR:uploads}
app.storage.s3.bucket=${S3_UPLOAD_BUCKET:}
app.storage.s3.prefix=${S3_UPLOAD_PREFIX:}
app.upload.student-verification-dir=${STUDENT_VERIFICATION_UPLOAD_DIR:uploads/student-verifications}
app.upload.profile-avatar-dir=${PROFILE_AVATAR_UPLOAD_DIR:uploads/profile-avatars}

# Realtime GPS push endpoint base URL (for driver app to know where to POST GPS).
# Used by WebSocket config to register STOMP endpoints.
app.realtime.allowed-origins=${REALTIME_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:*}}

# SePay payment gateway (real bank transfer webhook - configured by team)
app.sepay.bank-code=${SEPAY_BANK_CODE:MB}
app.sepay.account-no=${SEPAY_ACCOUNT_NO:20119999988888}
app.sepay.account-name=${SEPAY_ACCOUNT_NAME:Nguyen Truong Phuc}
app.sepay.qr-template=${SEPAY_QR_TEMPLATE:compact}
app.sepay.webhook-api-key=${SEPAY_WEBHOOK_API_KEY:unibus-sepay-webhook-key}
app.demo-fleet.enabled=${DEMO_FLEET_ENABLED:false}
