app.jwt.secret=${JWT_SECRET:unibus-local-dev-secret-at-least-32-characters}
app.ocr.enabled=${OCR_ENABLED:true}
app.ocr.provider=${OCR_PROVIDER:ocrspace}
app.ocr.fail-open-on-error=${OCR_FAIL_OPEN_ON_ERROR:true}
app.google.vision.credentials-path=${GOOGLE_APPLICATION_CREDENTIALS:../unibus-vision-ocr.json}
app.ocrspace.api-key=${OCRSPACE_API_KEY:helloworld}
app.ocrspace.endpoint=${OCRSPACE_ENDPOINT:https://api.ocr.space/parse/image}
app.ocrspace.language=${OCRSPACE_LANGUAGE:vnm}
app.ocrspace.engine=${OCRSPACE_ENGINE:2}
app.ai.enabled=true
app.ai.provider=zai
app.ai.zai.api-key=${ZAI_API_KEY:}
app.ai.zai.base-url=${ZAI_BASE_URL:https://api.z.ai/api/paas/v4/}
app.ai.zai.model-id=${ZAI_MODEL_ID:glm-4.5-flash}
