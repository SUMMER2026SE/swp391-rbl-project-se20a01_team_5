# Production profile overrides.
# Activate via SPRING_PROFILES_ACTIVE=prod

# Disable OTP logging in production - never leak OTP codes to logs.
app.otp.log-code=false

# Require SMTP for production (registration / password reset need email).
app.mail.enabled=true

# Restrict CORS to the configured frontend origins (comma-separated).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Restrict WebSocket origins to the same CORS allow-list.
app.realtime.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Validate Flyway migrations against the schema history in production.
spring.flyway.validate-on-migrate=true

# Connection pool tuning for production load.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# Logging - quieter at framework level, keep app level at INFO.
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.unibus=INFO
logging.level.org.flywaydb=INFO

# Actuator endpoints - expose only health and info publicly, metrics behind auth.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Server tuning
server.port=${SERVER_PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
