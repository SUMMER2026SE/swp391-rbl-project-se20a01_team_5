spring.datasource.url=jdbc:h2:mem:unibus-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
app.jwt.secret=test-only-secret-at-least-thirty-two-characters-long
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=14
app.otp.expiration-minutes=10
app.otp.log-code=false
app.mail.enabled=false
app.mail.from=test@unibus.local
app.mail.from-name=UniBus Test
app.google.client-id=
app.upload.student-verification-dir=target/test-uploads/student-verifications
app.upload.profile-avatar-dir=target/test-uploads/profile-avatars
